# =============================================================================
# KneeAxis College GPU Training — Master Configuration
# =============================================================================
# Edit this file to set dataset paths, training hyperparameters, and output
# locations. All training scripts, notebooks, and helpers read from this file.
# =============================================================================

project:
  name: "KneeAxis"
  version: "1.0.0"
  description: "AI-Assisted 3D Knee Reconstruction & Arthroplasty Planning"

# ---------------------------------------------------------------------------
# Dataset roots — adjust these to match your JupyterHub storage layout
# ---------------------------------------------------------------------------
datasets:
  oai_root: "datasets/OAI"
  most_root: "datasets/MOST"
  oaizib_root: "datasets/OAIZIB_CM"
  totalsegmentator_root: "datasets/TotalSegmentator"

# ---------------------------------------------------------------------------
# Manifest files — generated by prepare_manifests.py
# ---------------------------------------------------------------------------
manifests:
  oai: "manifests/oai_manifest.csv"
  most: "manifests/most_manifest.csv"
  oaizib: "manifests/oaizib_manifest.csv"

# ---------------------------------------------------------------------------
# Output directories
# ---------------------------------------------------------------------------
outputs:
  checkpoints: "checkpoints"
  models: "models"
  logs: "logs"
  evaluations: "outputs/evaluations"
  classification_outputs: "outputs/classification"
  segmentation_outputs: "outputs/segmentation"

# ---------------------------------------------------------------------------
# Training — Global
# ---------------------------------------------------------------------------
training:
  # Maximum training time in minutes. Training stops safely after this limit.
  max_minutes: 60
  # Random seed for reproducibility
  seed: 42
  # Mixed precision training (set to true if GPU supports float16)
  mixed_precision: false

# ---------------------------------------------------------------------------
# Model A — Kellgren-Lawrence Classification (ResNet50)
# ---------------------------------------------------------------------------
classification:
  # Architecture
  backbone: "ResNet50"
  num_classes: 5
  class_names: ["KL0", "KL1", "KL2", "KL3", "KL4"]

  # Input preprocessing
  image_size: 224
  channels: 3
  preprocessing: "imagenet"           # "imagenet" = /255 + ImageNet mean/std

  # Training hyperparameters
  batch_size: 16
  learning_rate: 0.0001
  epochs: 100                         # max epochs (may stop early via time limit)
  optimizer: "adam"
  label_smoothing: 0.1
  class_weights: "balanced"           # "balanced" | "none" | list of 5 floats

  # Transfer learning
  freeze_backbone_epochs: 5           # freeze backbone for N epochs, then unfreeze
  fine_tune_from_layer: 100           # unfreeze layers from this index onward

  # Data augmentation
  augmentation:
    horizontal_flip: true
    rotation_range: 15
    zoom_range: 0.1
    brightness_range: [0.8, 1.2]
    contrast_range: [0.8, 1.2]

  # Data splitting — by subject ID to prevent patient leakage
  split:
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15

  # tf.data pipeline
  prefetch_buffer: 2
  shuffle_buffer: 1000

# ---------------------------------------------------------------------------
# Model B — 3D Knee Segmentation (3D U-Net)
# ---------------------------------------------------------------------------
segmentation:
  # Architecture
  architecture: "3D_UNet"
  num_classes: 6
  class_names:
    0: "background"
    1: "femur"
    2: "femoral_cartilage"
    3: "tibia"
    4: "medial_tibial_cartilage"
    5: "lateral_tibial_cartilage"

  # Input — 3D patches extracted from full MRI volumes
  patch_size: [96, 96, 96]
  in_channels: 1

  # U-Net depth and filter configuration
  encoder_filters: [32, 64, 128, 256]
  bottleneck_filters: 512

  # Training hyperparameters
  batch_size: 2
  learning_rate: 0.0001
  epochs: 200                         # max epochs (time limit overrides)
  optimizer: "adam"

  # Loss
  loss: "dice_ce"                     # combined Dice + cross-entropy loss
  dice_smooth: 1.0

  # Patch sampling
  patches_per_volume: 8
  foreground_ratio: 0.5               # fraction of patches centred on foreground
  steps_per_epoch: 50                 # batches per epoch (controls epoch length)
  validation_steps: 10

  # Intensity normalisation
  normalisation: "z_score"            # "z_score" | "min_max" | "none"
  clip_percentile: [0.5, 99.5]

  # Data pipeline
  prefetch_buffer: 2
  cache_volumes: false                # set true only if RAM is ample

  # Spacing/resolution
  target_spacing: null                # null = use native; or [sx, sy, sz] in mm

# ---------------------------------------------------------------------------
# Model C — TotalSegmentator (external / optional)
# ---------------------------------------------------------------------------
totalsegmentator:
  # TotalSegmentator is treated as an optional external tool.
  # Its official model is NOT TensorFlow-based.
  role: "optional_baseline_or_preannotation"
  note: >
    TotalSegmentator is a nnU-Net-based (PyTorch) tool developed by
    Wasserthal et al. It may be used for pre-annotation or as an
    external baseline. It is NOT trained or fine-tuned here.

# ---------------------------------------------------------------------------
# OAIZIB-CM download (Zenodo)
# ---------------------------------------------------------------------------
oaizib_download:
  zenodo_record_id: "14934086"
  zenodo_url: "https://zenodo.org/records/14934086"
  expected_subfolders: ["imagesTr", "labelsTr", "imagesTs", "labelsTs"]
